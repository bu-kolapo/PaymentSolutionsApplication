spring.application.name=paymentSolutions
server.port=8081

# =========================
# PostgreSQL JDBC (JPA)
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:payment_solution_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update


# =========================
# Liquibase
# =========================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:payment_solution_db}
spring.liquibase.user=${DB_USERNAME:admin}
spring.liquibase.password=${DB_PASSWORD:admin}
spring.liquibase.drop-first=false
spring.flyway.enabled=false

# =========================
# Redis
# =========================

spring.data.redis.host=localhost
spring.data.redis.port=6379


spring.security.jwt.secret=dGhpc0lzQVNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZ1BsZWFzZUNoYW5nZUluUHJvZHVjdGlvbg==
spring.security.jwt.expiration=86400000

# =========================
# Claude AI Configuration
# =========================

ai.claude.api-key=${CLAUDE_API_KEY:your_key}
ai.claude.model=claude-opus-4-5-20251101
ai.claude.max-tokens=1024
payment.gateway.stripe.api-key=${STRIPE_API_KEY}
stripe.api-key=${STRIPE_API_KEY}

logging.level.com.paymentsolutions=DEBUG
logging.level.com.paymentsolutions.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.web.PagedResourcesAssembler=ERROR


